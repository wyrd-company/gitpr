$schema: https://intentional.foo/schemas/config.yml
contract: contract-1
settings:
  internal-dependency-bump: patch
  pre-1-0-bump-mapping: compatibility
discovery:
  managed-paths:
  - detector: go-module
    path: go.mod
    release-unit: gitpr
release-units:
  gitpr:
    path: .
    projections:
    - adapter: go
      file: go.mod
      mode: none
    - adapter: yaml
      file: docs/user/docs.yml
      mode: committed
      pointer: /products/gitpr/version
    tags:
      primary:
        role: primary
        template: '{version}'
  gitpr-docs:
    path: docs/user
    depends-on:
    - gitpr
    projections:
    - adapter: yaml
      file: docs.yml
      mode: committed
      pointer: /products/gitpr/docs-version
    tags:
      primary:
        role: primary
        template: '{id}@{version}'
