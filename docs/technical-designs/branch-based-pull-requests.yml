$schema: https://refinery.systems/ontology/technical-design
relationships:
  contextualized-by:
    - adopt-branch-based-pull-requests
objective: >-
  Reshape the gitpr pull request from a single immutable snapshot into a
  branch-scoped record that survives normal branch movement, while preserving
  the property that every verdict is an immutable judgment on an exact pair of
  commits. The PR follows its source branch; reviews are append-only events
  inside it; approval and merge are separate operations; the PR ends in a
  truthful final state.

background:
  current-design: >-
    A PR freezes its identity at creation: base branch, source head SHA, base
    head SHA, and merge base SHA are captured once, the diff and comments are
    anchored to that capture, and the status set is open, approved, or
    rejected. Merge fast-forwards the base branch to the recorded source head.
    Storage is ref-backed: refs/gitpr/pr/<id>/{meta,head,base} hold the
    metadata commit and pin the snapshot commits against garbage collection,
    and refs/gitpr/index/<status>/<id> provides status listing.
  problems:
    - A rebase of the source branch strands the snapshot; merge reports
      divergence even when the live branch would integrate cleanly.
    - Work that integrates by rebase, cherry-pick, or a later snapshot has no
      honest closure; the record must stay open or carry a false rejected
      verdict, and the open list stops working as a review queue.
    - The conversation dies with the verdict; review responses cannot attach
      to the closed snapshot that contains the finding.
    - Approval and merge are one operation, so a verdict cannot be recorded
      without writing the base branch; verification-only reviews and reviews
      performed under an external base-ref lease cannot record their outcome.
    - Approval does not gate on branch movement; nothing distinguishes the
      reviewed commits from whatever the branches point at when merge runs.

design-challenges:
  verdict-integrity: >-
    A verdict must remain a judgment on an exact pair of commits at a point in
    time, and merge must never ship commits nobody reviewed, even though the
    PR now tolerates branch movement.
  base-write-safety: >-
    Recording an approval must not mutate the base branch or create working
    trees. An external process may hold a lease on the base ref while a review
    concludes; merge must fail that race atomically instead of colliding with
    the lease or falling back to a temporary worktree.
  durable-conversation: >-
    Comment threads must survive successive review rounds and rebases, mark
    themselves outdated when their anchor no longer maps, and accept
    late comments after closure without changing any verdict.
  layered-compatibility: >-
    Existing snapshot records must remain readable and operable without
    migration or reinterpretation, while new records use the new model in the
    same storage namespace.

proposed-design:
  high-level-overview: >-
    A PR binds a source branch to a base branch and stays open while the work
    is in flight. Reviewing takes a snapshot — a review event — that captures
    the exact source head, base head, merge base, and diff, and ends in
    exactly one of two verdicts: accepted or rejected. Events are append-only
    and immutable. Approval writes the event and nothing else. Merge is a
    separate operation that succeeds only when both live branch heads still
    equal an accepted event's recorded heads, enforced as an atomic
    compare-and-swap on the base ref. Comment threads belong to the PR,
    re-anchor across events, and are explicitly resolvable. The PR ends as
    merged, or closed with a machine-readable reason.

  storage-model: >-
    Metadata authority stays at refs/gitpr/pr/<id>/meta. A new record carries
    schema: 2 in its metadata; a record without the field is a legacy snapshot
    and is read through the existing code path unchanged. Review events are
    stored in the metadata document and pinned by per-event refs
    refs/gitpr/pr/<id>/events/<event-id>/{head,base}, so every reviewed commit
    stays reachable against garbage collection exactly as the snapshot's
    head and base refs pin it today. Status indexes
    refs/gitpr/index/<state>/<id> carry the PR state; event verdicts are not
    indexed. All metadata writes go through the store's compare-and-swap
    primitive so a stale writer cannot silently overwrite a winner.

  status-vocabulary: >-
    Review events terminate in exactly two states: accepted or rejected. The
    PR lifecycle is open to merged, or open to closed with a reason. Closure
    reasons are integrated (the content landed by other means — rebase,
    cherry-pick, manual merge, or verification of an already-integrated
    head), superseded (a named replacement PR carries the work forward), and
    abandoned. A closure records structured evidence: the landed identity for
    integrated, the replacing PR id for superseded, and a free-text note.
    A verification-only review closes as integrated; its accepted event
    carries the approval, and the closure evidence preserves the exact
    repository identities the gate judged, so the record is neither stuck
    open nor falsely rejected.

  review-events: >-
    An event captures source_head_sha, base_head_sha, merge_base_sha, the
    computed diff, the verdict, and its timestamp. An event may name its
    predecessor event; the reviewer may scope re-review to the interdiff
    between the two events' diffs after a rebase or a remediation round.
    Events are never edited or deleted; a new judgment is a new event.

  staleness-and-merge-gating: >-
    Merge is permitted only against an accepted event whose recorded
    source_head_sha equals the live source branch head and whose recorded
    base_head_sha equals the live base branch head. Movement on either side
    invalidates the approval for merge purposes; the recovery is a new review
    event at the current heads, not an override. The gate is not a pre-check:
    merge executes git update-ref on the base with the expected old value set
    to the event's recorded base head, so a base that moves between check and
    write fails the swap atomically. Merge never creates a worktree to
    perform the write; when the base branch is checked out, the checked-out
    worktree is reconciled explicitly or the merge refuses with instructions.
    Refusal diagnostics name both the recorded and live SHA for the side that
    moved, and source-side and base-side refusals are distinct so one drift
    class cannot mask the other.

  approval-operation: >-
    Approve records an accepted event for the exact reviewed commits and
    performs no other repository mutation: no base write, no worktree
    creation, no cleanup. Reject records a rejected event symmetrically.
    Approve and merge are distinct verbs with distinct effects; no alias
    joins them.

  comment-lifecycle: >-
    A comment thread belongs to the PR. It anchors to a file, side, and line
    range in the diff of the event it was written against. When a new event
    is taken, anchors re-map through the diff between the two reviewed trees.
    A range that no longer maps, or whose content changed, marks the thread
    outdated: kept, displayed, flagged, never blocking — head equality
    already gates merge, so outdated marking is informational. Threads are
    explicitly resolvable and reopenable. Commenting is legal in every PR
    state, including merged and closed; a post-closure comment is visibly
    distinguished by its timestamp and event association.

  command-surface: >-
    create opens a branch-scoped PR without freezing a snapshot. review takes
    a snapshot and produces the event basis for a verdict. approve and reject
    record verdicts on the current event. merge performs the gated
    compare-and-swap integration. close ends the PR with a required reason
    and optional evidence. comment, resolve, and reopen operate on threads.
    list shows open PRs by default and exposes merged and closed records
    through state filters. show renders one PR with its events and threads.
    delete removes a record deliberately and exceptionally. Legacy verbs
    continue to operate on legacy records; new-model commands refuse a legacy
    id with an error naming the distinction.

  retention: >-
    Nothing drops from storage at closure. list defaults to open PRs so the
    queue signal stays clean; merged and closed records remain listable
    through filters and retrievable by id indefinitely. Deletion is a
    deliberate, exceptional act for mistaken creation or leaked content,
    never ordinary closure.

  backward-compatibility: >-
    Legacy snapshot records keep their vocabulary (open, approved, rejected)
    and their verbs, without reinterpretation into the new model: whether a
    legacy approved snapshot was merged is unknowable after the fact, so no
    mapping is fabricated. Legacy records remain readable, listable, and
    operable through the existing paths for the life of the tool. New records
    are created only in the new model. Nothing rewrites a legacy record.

  adjacent-work-reconciliation: >-
    The interim source-head merge guard (kanban 88, shipped) is absorbed by
    the source side of the merge gate; its diagnostics — name both SHAs,
    teach the recovery flow — carry into the gate's refusal errors. The
    target-head guard (kanban 698) is absorbed by the base side of the gate
    and the compare-and-swap; implementing it on the current model remains
    worthwhile before this design ships, and its diagnostics carry over the
    same way. The stale-SHA-after-rebase defect (kanban 212) loses its
    premise here because rebase becomes ordinary movement; only a
    diagnostic-level interim fix is safe before the reshape. Comments after
    closure (kanban 152) and honest closure (kanban 157) are absorbed by the
    comment lifecycle and the closure vocabulary; interim implementations
    are not recommended because they would build on surfaces this design
    replaces. The approve alias removal (kanban 240) is interim containment
    that this design makes permanent by contract. The delete verb (kanban
    238) survives unchanged in meaning. The metadata concurrency contract
    (kanban 574) is orthogonal and lands first; the event and thread writes
    here inherit its compare-and-swap store primitive.

  feasibility: >-
    Every mechanism reduces to existing plumbing: per-event pinning refs are
    the current head and base refs generalized; the merge gate is one
    update-ref invocation with an expected old value; anchor re-mapping is a
    diff walk between two reviewed trees, and its degraded mode — mark
    everything outdated — is safe. No serialization format, transport, or
    dependency changes are required.

  residual-risks: >-
    Strict double-equality gating raises re-review frequency; if
    interdiff-scoped re-review proves too coarse, pressure will build to
    loosen the gate rather than improve the review surface — the gate is the
    contract, the surface is the variable. Anchor re-mapping is the
    highest-complexity component; a weak remapper degrades to marking every
    thread outdated, which is safe but noisy.

  stated-assumptions: >-
    Per-event pinning refs keep repository ref count acceptable at gitpr's
    scale of one repository and one team. The metadata concurrency contract
    (kanban 574) lands before this design's implementation tasks; otherwise
    the new write paths need their own compare-and-swap treatment from day
    one.
