name: release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, such as 1.2.3
        required: true

permissions:
  contents: write

# The docs unit tags the same commit (gitpr-docs@<version>), so the release
# tag is passed explicitly: GoReleaser and git describe can pick either tag.
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ env.RELEASE_TAG }}

      - name: Check out Homebrew tap
        uses: actions/checkout@v5
        with:
          repository: wyrd-company/homebrew-tools
          ref: main
          path: homebrew-tools
          ssh-key: ${{ secrets.FORMULAE_PUBLISH_KEY }}
          # The next step's push requires the checkout's SSH key and command.
          # checkout removes them before that step when this is false.
          persist-credentials: true

      - name: Publish Homebrew formula
        run: bash scripts/publish-homebrew-tap.sh dist/checksums.txt homebrew-tools "$RELEASE_TAG"
