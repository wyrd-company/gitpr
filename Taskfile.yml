# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  BIN_DIR: ./bin
  BIN_PATH: "{{.BIN_DIR}}/gitpr"
  UAT_DIR: .tmp/uat
  UAT_REPO: "{{.UAT_DIR}}/repo"
  UAT_FEATURE: "{{.UAT_DIR}}/feature"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list
    silent: true

  build:
    desc: Build the gitpr CLI into ./bin/gitpr
    cmds:
      - mkdir -p "{{.BIN_DIR}}"
      - VERSION="$(tagver)"; go build -ldflags "-X main.version=$VERSION" -o "{{.BIN_PATH}}" ./cmd/gitpr

  version:
    desc: Print the calculated release version
    cmds:
      - tagver

  version:json:
    desc: Print the calculated release version as JSON
    cmds:
      - tagver --format json

  brand:render:
    desc: Render the social image PNGs from docs/brand with agent-browser
    cmds:
      - agent-browser set viewport 1200 630
      - agent-browser open "file://{{.ROOT_DIR}}/docs/brand/social-image.svg"
      - agent-browser wait 1500
      - agent-browser screenshot "{{.ROOT_DIR}}/docs/user/assets/social-image.png"
      - agent-browser set viewport 1280 640
      - agent-browser open "file://{{.ROOT_DIR}}/docs/brand/social-preview.svg"
      - agent-browser wait 1500
      - agent-browser screenshot "{{.ROOT_DIR}}/docs/brand/social-preview.png"
      - agent-browser close

  fmt:check:
    desc: Fail and name any tracked Go file that is not gofmt-formatted
    cmds:
      - |
        files="$(gofmt -l .)"
        if [ -n "$files" ]; then
          echo "gofmt: the following files are not formatted:" >&2
          echo "$files" >&2
          exit 1
        fi
    silent: true

  test:
    desc: Run the Go test suite
    deps:
      - fmt:check
    cmds:
      - go test -tags=test ./...

  check:
    desc: Run formatting, static analysis, and tests
    cmds:
      - task: fmt:check
      - go vet -tags=test ./...
      - go test -tags=test ./...

  release:
    desc: Show release tasks
    cmds:
      - task --list | rg "release:"
    silent: true

  release:check:
    desc: Validate GoReleaser and Homebrew publication
    cmds:
      - goreleaser check
      - bash -n scripts/render-homebrew-formula.sh scripts/publish-homebrew-tap.sh scripts/test-homebrew.sh
      - bash scripts/test-homebrew.sh

  release:snapshot:
    desc: Build snapshot release artifacts into ./dist
    cmds:
      - goreleaser release --snapshot --clean

  uat:
    desc: Show UAT tasks
    cmds:
      - task --list | rg "uat:"
    silent: true

  uat:clean:
    desc: Remove the disposable UAT repo and worktree under .tmp/uat
    cmds:
      - rm -rf {{.UAT_DIR}}

  uat:paths:
    desc: Print the current UAT paths
    cmds:
      - |
        printf "Repo:      %s\n" "$PWD/{{.UAT_REPO}}"
        printf "Worktree:  %s\n" "$PWD/{{.UAT_FEATURE}}"
        printf "Binary:    %s\n" "$PWD/{{.BIN_PATH}}"

  uat:setup:
    desc: Create a disposable UAT repo and feature worktree under .tmp/uat
    deps:
      - build
      - uat:clean
    cmds:
      - mkdir -p {{.UAT_REPO}}
      - git init -b main {{.UAT_REPO}}
      - git -C {{.UAT_REPO}} config user.name tester
      - git -C {{.UAT_REPO}} config user.email tester@example.com
      - printf "base\n" > {{.UAT_REPO}}/app.txt
      - mkdir -p {{.UAT_REPO}}/config {{.UAT_REPO}}/web
      - |
        cat > {{.UAT_REPO}}/config/app.yaml <<'EOF'
        app:
          name: gitpr-uat
          environment: dev
        review:
          required: false
          owners:
            - platform
        EOF
      - |
        cat > {{.UAT_REPO}}/web/main.ts <<'EOF'
        export function greet(name: string): string {
          return `hello, ${name}`;
        }

        console.log(greet("world"));
        EOF
      - git -C {{.UAT_REPO}} add app.txt
      - git -C {{.UAT_REPO}} add config/app.yaml web/main.ts
      - git -C {{.UAT_REPO}} commit -m "base"
      - git -C {{.UAT_REPO}} worktree add -b feature "$PWD/{{.UAT_FEATURE}}" HEAD
      - printf "feature\n" >> {{.UAT_FEATURE}}/app.txt
      - |
        cat > {{.UAT_FEATURE}}/config/app.yaml <<'EOF'
        app:
          name: gitpr-uat
          environment: test
        review:
          required: true
          owners:
            - platform
            - qa
        EOF
      - |
        cat > {{.UAT_FEATURE}}/web/main.ts <<'EOF'
        export function greet(name: string): string {
          return `hello, ${name}!`;
        }

        export function sum(a: number, b: number): number {
          return a + b;
        }

        console.log(greet("world"));
        EOF
      - git -C {{.UAT_FEATURE}} add app.txt
      - git -C {{.UAT_FEATURE}} add config/app.yaml web/main.ts
      - git -C {{.UAT_FEATURE}} commit -m "feature change"
      - |
        printf "\nUAT environment ready.\n\n"
        printf "Repo:      %s\n" "$PWD/{{.UAT_REPO}}"
        printf "Worktree:  %s\n" "$PWD/{{.UAT_FEATURE}}"
        printf "Binary:    %s\n\n" "$PWD/{{.BIN_PATH}}"
        printf "Suggested next steps:\n"
        printf "  cd %s\n" "$PWD/{{.UAT_FEATURE}}"
        printf "  \"%s\" create --title \"Feature PR\" --description \"UAT run\"\n" "$PWD/{{.BIN_PATH}}"
        printf "  cd %s\n" "$PWD/{{.UAT_REPO}}"
        printf "  \"%s\" list --status open\n" "$PWD/{{.BIN_PATH}}"

  uat:reset:
    desc: Recreate the disposable UAT repo and worktree from scratch
    deps:
      - uat:setup
